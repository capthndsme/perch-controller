# LEGACY: serving the dashboard from a static docroot on its own hostname,
# with the API on a second hostname. Only needed if you keep the dashboard on a
# different origin; build it with VITE_API_URL=https://<api host> in
# dashboard/.env and rsync public/ to the docroot after each build
# (deploy.sh does this when FE_DOCROOT is writable). Prefer
# apache-perch.conf, which needs one vhost and no docroot.
<VirtualHost *:443>
    ServerName dashboard.example.com
    DocumentRoot /var/www/metrics

    <Directory /var/www/metrics>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>
    <Directory /var/www/metrics/assets>
        FallbackResource disabled
        <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=31536000, immutable"
        </IfModule>
    </Directory>
    <Files "index.html">
        <IfModule mod_headers.c>
            Header set Cache-Control "no-cache"
        </IfModule>
    </Files>
</VirtualHost>
