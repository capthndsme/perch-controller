# Apache reverse proxy for the Perch Network Controller: one vhost, the API
# serves the dashboard.
# Requires: a2enmod proxy proxy_http headers ssl (or terminate TLS elsewhere).
# Replace metrics.example.com and the port (12553 here, PORT in .env.production).
<VirtualHost *:443>
    ServerName metrics.example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/metrics.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/metrics.example.com/privkey.pem

    ProxyPreserveHost On
    # upgrade=websocket (Apache 2.4.47+) passes WebSocket upgrades through:
    # Perch AP Daemons keep a session on /api/v1/ap-agent/ws and collectors on
    # /api/v1/collector-agent/ws. Without it APs join but can never connect,
    # and socket collectors never get in (docs/ap-controller.md section 5,
    # docs/collector-agent.md section 3).
    ProxyPass        / http://127.0.0.1:12553/ upgrade=websocket
    ProxyPassReverse / http://127.0.0.1:12553/

    # The API already sets Cache-Control (immutable for hashed assets,
    # no-cache for index.html and JSON); nothing to add here.
    RequestHeader set X-Forwarded-Proto "https"
</VirtualHost>

<VirtualHost *:80>
    ServerName metrics.example.com
    Redirect permanent / https://metrics.example.com/
</VirtualHost>
