# Perch Network Controller (API + dashboard) with its database. This is the
# whole default install: collectors and access points join it afterwards, the
# way devices join a UniFi controller.
#
#   docker compose up -d
#   open http://<this host>:8080  →  create the admin account, done.
#
# That is plain HTTP, for the dashboard and for the agents alike: keep this
# host, the router and the access points on a management VLAN that client
# devices cannot reach, and open the dashboard from there (or put the
# controller behind HTTPS). README: "Plain HTTP and a management VLAN".
#
# Then add collectors: the perch-collector OpenWrt package on your router
# (recommended: it sees all traffic and reports the gateway's stats), or a
# collector on any Linux box that sees the LAN traffic (a bridge, a mirror
# port). Both dial this server over a WebSocket and appear under Settings →
# Collectors → Pending adoption. Access points: Settings → Wi-Fi sources.
#
# A collector on THIS host (only useful when this host is where the LAN
# traffic passes: the router, a bridge, a mirror port) is the `collector`
# profile:
#
#   docker compose --profile collector up -d
#
# It captures on the host network, generates its API key on first start (kept
# in the collector-data volume) and dials this server like any other
# collector: adopt it in Settings → Collectors.
#
# Everything is optional and lives in a .env file next to this file. It is
# the same .env the server reads (see .env.example), so one file configures
# the whole stack:
#   PERCH_IMAGE_TAG=latest           image tag of the server and collector: latest = the
#                                    last final release, 1.0.0-rc.2 / rc = a release
#                                    candidate, edge = main
#   PERCH_HTTP_PORT=8080             port the dashboard listens on
#   PERCH_HTTP_BIND=0.0.0.0          bind address (127.0.0.1 behind a reverse proxy)
#   PERCH_DB_BUFFER_POOL=512M        InnoDB buffer pool of the bundled MariaDB
#   PERCH_SSH_DIR=                   a ~/.ssh to mount read-only (AP control, SSH hostname enrichment)
#   PERCH_NET_SUBNET=172.28.0.0/24   the stack's private network; change both on a clash
#   PERCH_NET_GATEWAY=172.28.0.1     its gateway address
#   TRUST_PROXY=loopback,172.28.0.1  whose X-Forwarded-For to believe (set below)
#   DB_PASSWORD / DB_DATABASE        bundled MariaDB root password / database (metricslite)
#   APP_KEY, TZ, retention knobs …   as in .env.example
# For the `collector` profile only:
#   PERCH_CAPTURE_INTERFACE=         interface to capture on (empty = default route)
#   PERCH_GATEWAY_MACS=              comma-separated upstream gateway MACs (empty = auto)
#   PERCH_COLLECTOR_GATEWAY_STATS=auto   on when this host IS the router (conntrack, WAN rate)
#   PERCH_COLLECTOR_SERVER_URL=      how the collector reaches this server
#                                    (default http://127.0.0.1:$PERCH_HTTP_PORT)
#   PERCH_COLLECTOR_API_KEY=         its key (empty = generated on first start)
#
# The project is named `perch` (container and volume names). An install that
# started under an older name keeps it with COMPOSE_PROJECT_NAME in .env, or
# its database volume would look empty.
#
# Networking: MariaDB has no published port, it is reachable only inside the
# stack's network. The optional collector runs on the host network (it has to
# see the LAN), dials out to the server and answers its own API on 127.0.0.1
# only, so nothing new is exposed to the LAN. To reach the database from the
# host (tests, ace commands), add docker-compose.db-port.yml
# (COMPOSE_FILE=docker-compose.yml:docker-compose.db-port.yml in .env).
#
# Bring your own database: docker-compose.external-db.yml (no db service).
# Existing MariaDB on 127.0.0.1 plus a reverse proxy: docker-compose.host.yml.
name: perch

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-metricslite}
      MARIADB_DATABASE: ${DB_DATABASE:-metricslite}
      MARIADB_AUTO_UPGRADE: "1"
    command:
      - --innodb-buffer-pool-size=${PERCH_DB_BUFFER_POOL:-512M}
      - --innodb-buffer-pool-size-max=${PERCH_DB_BUFFER_POOL_MAX:-4G}
      - --innodb-flush-log-at-trx-commit=2
      - --innodb-log-file-size=256M
      - --default-time-zone=+00:00
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 40

  server:
    image: ghcr.io/capthndsme/perch-controller:${PERCH_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PERCH_HTTP_BIND:-0.0.0.0}:${PERCH_HTTP_PORT:-8080}:3333"
    env_file:
      - path: .env
        required: false
      - path: .env.production
        required: false
    environment:
      # Fixed for the container; .env values for these are for host tooling.
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3333"
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-metricslite}
      DB_DATABASE: ${DB_DATABASE:-metricslite}
      TZ: ${TZ:-UTC}
      # Requests forwarded by a reverse proxy on the host reach the container
      # from the stack's GATEWAY, so that one address has to be trusted for
      # X-Forwarded-For — otherwise a collector's socket or announce would
      # record the gateway as the collector's address. Deliberately the gateway and not
      # the whole subnet: every sibling container sits on that subnet and
      # would otherwise be able to forge the header.
      TRUST_PROXY: loopback,${PERCH_NET_GATEWAY:-172.28.0.1}
    volumes:
      - server-data:/data
      - ${PERCH_SSH_DIR:-ssh-keys}:/root/.ssh:ro

  # Opt-in (see the top of this file): docker compose --profile collector up -d
  collector:
    image: ghcr.io/capthndsme/perch-collector:${PERCH_IMAGE_TAG:-latest}
    profiles: ["collector"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      # Dials the server's published port over the host's loopback; the
      # server then lists it under Settings → Collectors → Pending adoption.
      PERCH_COLLECTOR_SERVER_URL: ${PERCH_COLLECTOR_SERVER_URL:-http://127.0.0.1:${PERCH_HTTP_PORT:-8080}}
      PERCH_COLLECTOR_TRANSPORT: websocket
      # Empty: the entrypoint generates the key once, into collector-data.
      PERCH_COLLECTOR_API_KEY: ${PERCH_COLLECTOR_API_KEY:-}
      PERCH_COLLECTOR_LISTEN: 127.0.0.1:9800
      PERCH_COLLECTOR_INTERFACE: ${PERCH_CAPTURE_INTERFACE:-}
      PERCH_COLLECTOR_GATEWAY_MACS: ${PERCH_GATEWAY_MACS:-}
      PERCH_COLLECTOR_GATEWAY_STATS: ${PERCH_COLLECTOR_GATEWAY_STATS:-auto}
    volumes:
      # API key and instance id: the collector's identity across restarts.
      - collector-data:/var/lib/perch-collector

networks:
  default:
    ipam:
      config:
        - subnet: ${PERCH_NET_SUBNET:-172.28.0.0/24}
          gateway: ${PERCH_NET_GATEWAY:-172.28.0.1}

volumes:
  db-data:
  server-data:
  collector-data:
  # Placeholder mounted at /root/.ssh when PERCH_SSH_DIR is unset.
  ssh-keys:
